[package]
name = "break_reminder_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.8"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["ico"] }
winreg = "0.52"

[build-dependencies]
slint-build = "1.8"
winres = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
